[package]
name = "umubox"
version = "0.1.0"
edition = "2024"
description = "UmuBox - Native GPU-accelerated Rust + GPUI Proton/UMU Game & Prefix Manager"
license = "MIT"

[[bin]]
name = "umubox"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.10.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
sha2 = "0.10"
image = "0.25"

[dev-dependencies]
tempfile = "3"
